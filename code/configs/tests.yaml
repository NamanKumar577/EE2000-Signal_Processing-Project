# configs/tests.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Verified test-case registry for the FECG extraction benchmark.
# All paths are relative to the repository root (EE2000-Signal_Processing-Project/).
# Sampling rate: 250 Hz  |  Resolution: 16-bit  |  Duration: 5 min (75 000 samples)
#
# Components per test case:
#   fecg1   — clean fetal ECG (EVALUATION ONLY, never fed to extraction)
#   mecg    — maternal ECG component
#   noise1  — noise component 1
#   noise2  — noise component 2
#   qrs_fecg — fetal beat annotations (EVALUATION ONLY)
#   qrs_mecg — maternal beat annotations
# ──────────────────────────────────────────────────────────────────────────────

common:
  sampling_rate_hz: 250          # verified from .hea headers
  n_samples: 75000               # samples per component file
  record_duration_s: 300         # 5 minutes
  channel_index: 0               # channel to extract (multi-channel files; use ch 0)
  qrs_annotation_extension_fecg: "qrs"   # wfdb annotation extension for fetal QRS
  qrs_annotation_extension_mecg: "qrs"   # wfdb annotation extension for maternal QRS

test_cases:

  TC1:
    id: TC1
    snr_db: 12
    case: c0
    description: "Easier baseline — basic extraction check"
    status: verified
    folder: test/test1
    records:
      fecg1: test/test1/sub01_snr12dB_l1_c0_fecg1
      mecg:  test/test1/sub01_snr12dB_l1_c0_mecg
      noise1: test/test1/sub01_snr12dB_l1_c0_noise1
      noise2: test/test1/sub01_snr12dB_l1_c0_noise2

  TC2:
    id: TC2
    snr_db: 6
    case: c0
    description: "Moderate-noise robustness"
    status: verified
    folder: test/test2
    records:
      fecg1: test/test2/sub01_snr06dB_l1_c0_fecg1
      mecg:  test/test2/sub01_snr06dB_l1_c0_mecg
      noise1: test/test2/sub01_snr06dB_l1_c0_noise1
      noise2: test/test2/sub01_snr06dB_l1_c0_noise2

  TC3:
    id: TC3
    snr_db: 0
    case: c0
    description: "Difficult baseline — signal/noise power ratio 1:1"
    status: verified
    folder: test/test3
    records:
      fecg1: test/test3/sub01_snr00dB_l1_c0_fecg1
      mecg:  test/test3/sub01_snr00dB_l1_c0_mecg
      noise1: test/test3/sub01_snr00dB_l1_c0_noise1
      noise2: test/test3/sub01_snr00dB_l1_c0_noise2

  TC4:
    id: TC4
    snr_db: 6
    case: c1
    description: "Fetal-movement condition"
    status: verified
    folder: test/test4
    records:
      fecg1: test/test4/sub01_snr06dB_l1_c1_fecg1
      mecg:  test/test4/sub01_snr06dB_l1_c1_mecg
      noise1: test/test4/sub01_snr06dB_l1_c1_noise1
      noise2: test/test4/sub01_snr06dB_l1_c1_noise2

  TC5:
    id: TC5
    snr_db: 6
    case: c4
    description: "Ectopic-beat condition"
    status: verified
    folder: test/test5
    records:
      fecg1: test/test5/sub01_snr06dB_l1_c4_fecg1
      mecg:  test/test5/sub01_snr06dB_l1_c4_mecg
      noise1: test/test5/sub01_snr06dB_l1_c4_noise1
      noise2: test/test5/sub01_snr06dB_l1_c4_noise2
