# configs/preprocessing.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Frozen shared preprocessing configuration.
# Owner: Astitva (preprocessing module)
# All methods MUST use these settings for the common baseline preprocessing.
# Method-specific extra transforms must be documented separately.
#
# DO NOT change these values mid-benchmark without team agreement and full rerun.
# ──────────────────────────────────────────────────────────────────────────────

preprocessing:
  sampling_rate_hz: 250            # dataset sampling rate; read from header; do not hardcode elsewhere

  baseline_wander_removal:
    enabled: true
    method: highpass               # high-pass IIR filter to remove slow drift
    filter_type: butterworth
    order: 4
    cutoff_hz: 0.5                 # removes DC and respiratory-band wander

  bandpass_filter:
    enabled: true
    filter_type: butterworth
    order: 4
    lowcut_hz: 0.5                 # lower edge — must match or exceed BWR cutoff
    highcut_hz: 40.0               # upper edge appropriate for QRS analysis at 250 Hz
    phase: zero                    # zero-phase (offline); NOTE: not causal — incompatible
                                   # with real-time FPGA pipeline; document explicitly

  powerline_notch:
    enabled: false                 # disabled by default — FECGSYNDB is synthetic, no 50/60 Hz mains
                                   # enable only if real-data recordings show powerline interference
    notch_hz: 50.0
    quality_factor: 30.0           # Q = f0 / bandwidth

  edge_handling:
    method: padding                # pad signal edges before filtering to reduce transients
    pad_samples: 250               # 1 second at 250 Hz

# Notes (freeze before benchmark):
# - Zero-phase filtering introduces non-causal behavior; label all results accordingly.
# - Powerline notch is OFF for FECGSYNDB runs.
# - These settings apply to the mixture input before extraction.
# - Astitva must validate frequency response and plot before/after waveforms.
